map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost *.localhost;
    root /var/www/backend/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 50M;

    # Laravel API, Sanctum, Healthcheck, Storage
    location ~ ^/(api|sanctum|up|storage)(/|$) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Handler for Laravel
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Allow any *.localhost origin seamlessly through Laravel HandleCors in local dev
        fastcgi_param HTTP_ORIGIN http://localhost:5174;
        fastcgi_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With, X-XSRF-TOKEN" always;
    }

    # Proxy all frontend routes & HMR WebSockets to Vite Dev Server
    location / {
        proxy_pass http://vite:5174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host localhost:5174;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
