services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: sarwary_app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - sarwary_net

  nginx:
    image: nginx:alpine
    container_name: sarwary_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - vite
    networks:
      - sarwary_net

  mysql:
    image: mysql:8.0
    container_name: sarwary_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: sarwary_local
      MYSQL_USER: sarwary
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - sarwary_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - sarwary_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sarwary_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootsecret
    ports:
      - "8082:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sarwary_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: sarwary_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - sarwary_net

  vite:
    image: node:22-alpine
    container_name: sarwary_vite
    restart: unless-stopped
    working_dir: /app/frontend
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: .localhost
    volumes:
      - ./frontend:/app/frontend
      - ./backend:/app/backend
      - sarwary_frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5174:5174"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    networks:
      - sarwary_net

networks:
  sarwary_net:
    driver: bridge

volumes:
  sarwary_mysql_data:
  sarwary_frontend_node_modules:
